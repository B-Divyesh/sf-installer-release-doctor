<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Release Doctor sample terminal recording</title>
  <desc id="desc">The checker passes archive checks, fails a missing provenance check, and prints its repair.</desc>
  <rect width="960" height="420" fill="#171915"/>
  <rect width="960" height="52" fill="#f4f2e8"/>
  <g font-family="monospace" font-size="22">
    <text x="24" y="34" fill="#101010" font-weight="bold">release-doctor demo</text>
    <text x="24" y="100" fill="#d7ff3f">PASS  winget  archive-safety  Archive has 2 safe entries.</text>
    <text x="24" y="146" fill="#d7ff3f">PASS  winget  archive-layout  Archive contains acme.</text>
    <text x="24" y="192" fill="#ff6b61">FAIL  winget  provenance      Provenance companion is missing.</text>
    <text x="24" y="238" fill="#f4f2e8">      repair: Create the .intoto.jsonl companion.</text>
    <line x1="24" y1="282" x2="936" y2="282" stroke="#f4f2e8" stroke-width="2"/>
    <text x="24" y="330" fill="#f4f2e8">0 of 1 channels ready · 0 warnings · 1 failure</text>
    <text x="24" y="378" fill="#ff6b61" font-weight="bold">exit 1</text>
  </g>
</svg>
