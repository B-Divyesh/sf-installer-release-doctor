name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 0.1.2
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu
      - name: Install musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools rpm
      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4
      - name: Build binaries
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Package assets
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION=$(echo "$VERSION" | sed 's/^v//')
          mkdir -p release/x64
          cp target/x86_64-unknown-linux-musl/release/release-doctor release/x64/
          tar -C release/x64 -czf release/release-doctor-v$VERSION-linux-x86_64.tar.gz release-doctor
          VERSION=$VERSION "$(go env GOPATH)/bin/nfpm" package --config nfpm.yaml --packager deb --target release/release-doctor-$VERSION-amd64.deb
          VERSION=$VERSION "$(go env GOPATH)/bin/nfpm" package --config nfpm.yaml --packager rpm --target release/release-doctor-$VERSION.x86_64.rpm
          test "$(dpkg-deb -f release/release-doctor-$VERSION-amd64.deb Package)" = release-doctor
          test "$(dpkg-deb -f release/release-doctor-$VERSION-amd64.deb Version)" = "$VERSION"
          test "$(dpkg-deb -f release/release-doctor-$VERSION-amd64.deb Architecture)" = amd64
          test "$(rpm -qp --qf '%{NAME}\n' release/release-doctor-$VERSION.x86_64.rpm)" = release-doctor
          test "$(rpm -qp --qf '%{VERSION}\n' release/release-doctor-$VERSION.x86_64.rpm)" = "$VERSION"
          test "$(rpm -qp --qf '%{ARCH}\n' release/release-doctor-$VERSION.x86_64.rpm)" = x86_64
          rm -rf release/x64
      - uses: actions/upload-artifact@v4
        with: {name: linux-assets, path: release/*}
  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package assets
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION=$(echo "$VERSION" | sed 's/^v//')
          mkdir -p release/arm64 release/x64 pkgroot/usr/local/bin
          cp target/aarch64-apple-darwin/release/release-doctor release/arm64/
          cp target/x86_64-apple-darwin/release/release-doctor release/x64/
          tar -C release/arm64 -czf release/release-doctor-v$VERSION-darwin-aarch64.tar.gz release-doctor
          tar -C release/x64 -czf release/release-doctor-v$VERSION-darwin-x86_64.tar.gz release-doctor
          cp target/aarch64-apple-darwin/release/release-doctor pkgroot/usr/local/bin/
          pkgbuild --root pkgroot --identifier in.sociobot.installer-release-doctor --version "$VERSION" release/release-doctor-v$VERSION-darwin-aarch64.pkg
          rm -rf release/arm64 release/x64 pkgroot
      - uses: actions/upload-artifact@v4
        with: {name: macos-assets, path: release/*}
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $Version = "${{ github.event.inputs.version || github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory release | Out-Null
          Compress-Archive target/release/release-doctor.exe "release/release-doctor-v$Version-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with: {name: windows-assets, path: release/*}
  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    env:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: gathered}
      - name: Create checksums, manifest, and formula
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION=$(echo "$VERSION" | sed 's/^v//')
          mkdir release
          find gathered -type f -exec cp {} release/ \;
          (cd release && sha256sum release-doctor-* > SHA256SUMS)
          node scripts/make-latest.mjs "$VERSION" "$REPOSITORY" release
          SHA_ARM=$(awk '/darwin-aarch64.tar.gz/{print $1}' release/SHA256SUMS)
          SHA_X64=$(awk '/darwin-x86_64.tar.gz/{print $1}' release/SHA256SUMS)
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA_ARM@/$SHA_ARM/g" -e "s/@SHA_X64@/$SHA_X64/g" packaging/homebrew/installer-release-doctor.rb.in > release/installer-release-doctor.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ env.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::TAP_GITHUB_TOKEN is required to publish the advertised Homebrew channel"
            exit 1
          fi
          CONTENT=$(base64 -w0 release/installer-release-doctor.rb)
          FORMULA_SHA=$(gh api repos/B-Divyesh/homebrew-installer-release-doctor/contents/Formula/installer-release-doctor.rb --jq .sha 2>/dev/null || true)
          if [ -n "$FORMULA_SHA" ]; then
            gh api --method PUT repos/B-Divyesh/homebrew-installer-release-doctor/contents/Formula/installer-release-doctor.rb -f message="publish formula ${{ github.event.inputs.version || github.ref_name }}" -f content="$CONTENT" -f sha="$FORMULA_SHA"
          else
            gh api --method PUT repos/B-Divyesh/homebrew-installer-release-doctor/contents/Formula/installer-release-doctor.rb -f message="publish formula ${{ github.event.inputs.version || github.ref_name }}" -f content="$CONTENT"
          fi

  homebrew-consumer:
    needs: publish
    runs-on: macos-latest
    steps:
      - name: Install from the documented public tap
        run: brew install B-Divyesh/installer-release-doctor/installer-release-doctor
      - name: Exercise the installed binary
        env:
          EXPECTED_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          EXPECTED_VERSION=${EXPECTED_VERSION#v}
          release-doctor --version | grep "$EXPECTED_VERSION"
          set +e
          release-doctor demo --format json > demo.json
          status=$?
          set -e
          test "$status" -eq 1
          python3 -c 'import json; report=json.load(open("demo.json")); assert report["summary"]["failures"] == 1'
